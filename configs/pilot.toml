[run]
name = "pilot"
profile = "pilot"
seed = 20261106
output_root = "results"

[data]
backend = "huggingface"
dataset_id = "cais/mmlu"
dataset_config = "all"
revision = "c30699e"
split = "test"
max_questions = 400
subjects = []

[paraphrases]
mode = "templates"
variants = ["canonical", "direct", "exam", "minimal"]
curated_path = "data/curated_paraphrases.csv"
require_validated = false

[model]
backend = "huggingface"
model_id = "Qwen/Qwen2.5-1.5B-Instruct"
revision = "989aa79"
device = "auto"
dtype = "auto"
batch_size = 4
max_input_tokens = 1024
max_new_tokens = 8

[features]
layers = [0.25, 0.5, 0.75, 1.0]
pooling = "last_prompt_token"

[split]
train_fraction = 0.60
validation_fraction = 0.20
test_fraction = 0.20
heldout_subjects = [
  "clinical_knowledge",
  "college_computer_science",
  "high_school_world_history",
  "professional_law",
]

[probe]
c = 1.0
max_iter = 3000
class_weight = "balanced"
invariant_variance = 0.80
max_invariant_components = 16

[evaluation]
bootstrap_replicates = 1000
confidence_level = 0.95
stable_error_margin = 0.05
calibration_bins = 10
primary_layer = 1.0

[output]
save_features = true
save_models = true
save_bootstrap_samples = true

