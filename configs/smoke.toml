[run]
name = "smoke"
profile = "smoke"
seed = 20261106
output_root = "results"

[data]
backend = "huggingface"
dataset_id = "cais/mmlu"
dataset_config = "all"
revision = "c30699e"
split = "test"
max_questions = 24
subjects = [
  "business_ethics",
  "high_school_biology",
  "high_school_computer_science",
  "high_school_world_history",
]

[paraphrases]
mode = "templates"
variants = ["canonical", "direct", "exam"]
curated_path = "data/curated_paraphrases.csv"
require_validated = false

[model]
backend = "huggingface"
model_id = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae5576"
device = "auto"
dtype = "auto"
batch_size = 2
max_input_tokens = 1024
max_new_tokens = 8

[features]
layers = [0.25, 0.5, 0.75, 1.0]
pooling = "last_prompt_token"

[split]
train_fraction = 0.60
validation_fraction = 0.20
test_fraction = 0.20
heldout_subjects = []

[probe]
c = 1.0
max_iter = 2000
class_weight = "balanced"
invariant_variance = 0.80
max_invariant_components = 8

[evaluation]
bootstrap_replicates = 200
confidence_level = 0.95
stable_error_margin = 0.05
calibration_bins = 8
primary_layer = 1.0

[output]
save_features = true
save_models = true
save_bootstrap_samples = false

