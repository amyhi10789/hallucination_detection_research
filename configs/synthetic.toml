[run]
name = "synthetic"
profile = "synthetic-test"
seed = 20261106
output_root = "results"

[data]
backend = "synthetic"
dataset_id = "synthetic/mmlu"
dataset_config = "all"
revision = "local"
split = "test"
max_questions = 48
subjects = ["biology", "history", "computer_science", "ethics"]

[paraphrases]
mode = "templates"
variants = ["canonical", "direct", "exam"]
curated_path = "data/curated_paraphrases.csv"
require_validated = false

[model]
backend = "synthetic"
model_id = "synthetic-hidden-state-model"
revision = "local"
device = "cpu"
dtype = "float32"
batch_size = 8
max_input_tokens = 256
max_new_tokens = 4

[features]
layers = [0.25, 0.5, 0.75, 1.0]
pooling = "last_prompt_token"

[split]
train_fraction = 0.60
validation_fraction = 0.20
test_fraction = 0.20
heldout_subjects = ["ethics"]

[probe]
c = 1.0
max_iter = 1000
class_weight = "balanced"
invariant_variance = 0.80
max_invariant_components = 4

[evaluation]
bootstrap_replicates = 50
confidence_level = 0.95
stable_error_margin = 0.10
calibration_bins = 5
primary_layer = 1.0

[output]
save_features = true
save_models = true
save_bootstrap_samples = false

