[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-detection-research"
version = "0.1.0"
description = "Reproducible experiments for testing pre-generation hidden-state hallucination detectors under paraphrase shift."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0,<5",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "torch>=2.4,<3",
  "transformers>=4.37,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
hallucination-detection = "hallucination_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "network: downloads a public model or dataset",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

